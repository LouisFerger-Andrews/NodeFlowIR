[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nodeflowir"
version = "0.1.0"
description = "A typed, canonical intermediate representation for node-based workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "NodeFlowIR contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/LouisFerger-Andrews/NodeFlowIR"
Repository = "https://github.com/LouisFerger-Andrews/NodeFlowIR"

[tool.hatch.build.targets.wheel]
packages = ["nodeflowir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
