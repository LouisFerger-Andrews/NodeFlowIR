name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Check formatting
        run: .venv/bin/ruff format --check .
      - name: Type check
        run: .venv/bin/pyright
      - name: Run tests
        run: .venv/bin/pytest
      - name: Compile package
        run: .venv/bin/python -m compileall -q nodeflowir
      - name: Generate public JSON Schemas
        run: |
          .venv/bin/python -c 'from nodeflowir import NodeFlow, Workflow, WorkflowAccessPolicy, WorkflowCatalog, WorkflowIdentity, WorkflowRevision; models = (Workflow, WorkflowCatalog, WorkflowAccessPolicy, WorkflowIdentity, WorkflowRevision); assert all(model.model_json_schema() for model in models); NodeFlow()'

  package:
    name: Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect wheel contents
        run: |
          python -c 'from pathlib import Path; from zipfile import ZipFile; wheel = next(Path("dist").glob("*.whl")); contents = ZipFile(wheel).namelist(); assert "nodeflowir/py.typed" in contents; assert not any(name.startswith("tests/") for name in contents)'
      - name: Smoke test installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -c 'import nodeflowir; from nodeflowir import NodeFlow, Workflow; NodeFlow(); assert Workflow.model_json_schema(); assert nodeflowir.__file__'

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Check flake
        run: nix flake check
      - name: Verify development shell
        run: |
          nix develop --command python --version
          nix develop --command uv sync --extra dev
          nix develop --command uv run ruff check .
          nix develop --command uv run ruff format --check .
          nix develop --command uv run pyright
          nix develop --command uv run pytest
